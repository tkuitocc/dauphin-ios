name: Build iOS app

on:
  pull_request:
  push:
  workflow_dispatch:

jobs:
  build:
    name: Build
    runs-on: macOS-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v7
      - name: Add plist file
        env:
          AES256KEY: ${{ secrets.DAUPHIN_IOS_AES256KEY }}
          AES256IV: ${{ secrets.DAUPHIN_IOS_AES256KIV }}
        run: |
          set -eu

          : "${AES256KEY:?Set AES256KEY in the GitHub Actions workflow environment}"
          : "${AES256IV:?Set AES256IV in the GitHub Actions workflow environment}"

          script_directory="$GITHUB_WORKSPACE"
          template_path="${script_directory}/app/dauphin/api.example.plist"
          output_path="${script_directory}/app/dauphin/api.plist"
          temporary_path="$(mktemp "${output_path}.XXXXXX")"

          cleanup() {
              rm -f "$temporary_path"
          }
          trap cleanup EXIT HUP INT TERM

          cp "$template_path" "$temporary_path"
          /usr/bin/plutil -replace AES.KEY -string "$AES256KEY" "$temporary_path"
          /usr/bin/plutil -replace AES.IV -string "$AES256IV" "$temporary_path"
          /usr/bin/plutil -lint "$temporary_path"
          mv "$temporary_path" "$output_path"
          trap - EXIT HUP INT TERM

          echo "Generated dauphin/api.plist for the GitHub Actions workflow."
      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: 'zulu'
          java-version: 21
      - name: Set Xcode version
        run: sudo xcode-select -s /Applications/Xcode.app/Contents/Developer
      - name: iOS debug build
        uses: nick-fields/retry@v4
        with:
          timeout_minutes: 15
          max_attempts: 5
          command: cd app && xcodebuild -scheme dauphin -configuration Debug -sdk iphoneos -destination 'generic/platform=iOS' CODE_SIGNING_ALLOWED='NO' CODE_SIGNING_REQUIRED='NO' ONLY_ACTIVE_ARCH='NO' SYMROOT=$(pwd)/build clean build
      - name: iOS generate IPA file
        run: |
          rm -rf Payload
          mkdir -p Payload
          cp -r "$(pwd)/app/build/Debug-iphoneos/dauphin.app" Payload/
          zip -r iosApp_debug.ipa Payload
          rm -rf Payload
      - name: Upload artifacts - iosapp_debug.ipa
        uses: actions/upload-artifact@v7
        with:
          name: iosapp_debug.ipa
          path: ./iosApp_debug.ipa
          if-no-files-found: ignore
      - name: iOS release build
        uses: nick-fields/retry@v4
        with:
          timeout_minutes: 15
          max_attempts: 5
          command: cd app && xcodebuild -scheme dauphin -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' CODE_SIGNING_ALLOWED='NO' CODE_SIGNING_REQUIRED='NO' ONLY_ACTIVE_ARCH='NO' SYMROOT=$(pwd)/build clean build
      - name: iOS generate IPA file
        run: |
          rm -rf Payload
          mkdir -p Payload
          cp -r "$(pwd)/app/build/Release-iphoneos/dauphin.app" Payload/
          zip -r iosApp_release.ipa Payload
          rm -rf Payload
      - name: Upload artifacts - iosApp_release.ipa
        uses: actions/upload-artifact@v7
        with:
          name: iosapp_release.ipa
          path: ./iosApp_release.ipa
          if-no-files-found: ignore
