on:
  pull_request:
    paths:
      - "app/**"
      - "scripts/**"
      - ".github/workflows/ci.yml"
  push:
    branches:
      - dev
    paths:
      - "app/**"
      - "scripts/**"
      - ".github/workflows/ci.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  checks: write

jobs:
  swift_format:
    name: swift-format
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install swift-format
        env:
          HOMEBREW_NO_AUTO_UPDATE: "1"
        run: brew install swift-format

      - name: Check Format
        run: swift-format lint --configuration app/.swift-format --recursive .

      - name: Format summary
        if: always()
        run: |
          {
            echo "## swift-format"
            echo "- Status: ${{ job.status }}"
          } >> "$GITHUB_STEP_SUMMARY"

  localization_check:
    name: localization-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.1.0

      - name: Check localizations
        run: uv run scripts/check_localizations.py

      - name: Localization summary
        if: always()
        run: |
          {
            echo "## localization-check"
            echo "- Status: ${{ job.status }}"
          } >> "$GITHUB_STEP_SUMMARY"

  test:
    name: test
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7

      - name: Add plist file
        env:
          AES256KEY: ${{ secrets.DAUPHIN_IOS_AES256KEY }}
          AES256IV: ${{ secrets.DAUPHIN_IOS_AES256KIV }}
        run: |
          set -eu

          : "${AES256KEY:?Set AES256KEY in the GitHub Actions workflow environment}"
          : "${AES256IV:?Set AES256IV in the GitHub Actions workflow environment}"

          script_directory="$GITHUB_WORKSPACE"
          template_path="${script_directory}/app/dauphin/api.example.plist"
          output_path="${script_directory}/app/dauphin/api.plist"
          temporary_path="$(mktemp "${output_path}.XXXXXX")"

          cleanup() {
              rm -f "$temporary_path"
          }
          trap cleanup EXIT HUP INT TERM

          cp "$template_path" "$temporary_path"
          /usr/bin/plutil -replace AES.KEY -string "$AES256KEY" "$temporary_path"
          /usr/bin/plutil -replace AES.IV -string "$AES256IV" "$temporary_path"
          /usr/bin/plutil -lint "$temporary_path"
          mv "$temporary_path" "$output_path"
          trap - EXIT HUP INT TERM

          echo "Generated dauphin/api.plist for the GitHub Actions workflow."

      - name: Show Xcode
        run: |
          xcodebuild -version
          xcode-select -p

      - name: Cache SwiftPM packages
        uses: actions/cache@v6
        with:
          path: ${{ github.workspace }}/.spm
          key: ${{ runner.os }}-spm-${{ hashFiles('**/Package.resolved') }}
          restore-keys: |
            ${{ runner.os }}-spm-

      - name: Install xcbeautify
        env:
          HOMEBREW_NO_AUTO_UPDATE: "1"
        run: brew install xcbeautify

      - name: Build and run unit tests (iOS Simulator)
        run: |
          mkdir -p reports
          set -o pipefail
          xcrun simctl list devices available
          xcodebuild \
            -project app/dauphin.xcodeproj \
            -scheme "dauphin" \
            -testPlan Models \
            -configuration Debug \
            -destination 'platform=iOS Simulator,name=iPhone 17' \
            -clonedSourcePackagesDirPath "${{ github.workspace }}/.spm" \
            -resultBundlePath TestResults.xcresult \
            test | xcbeautify --renderer github-actions --report junit --report-path reports/junit.xml

      - name: Publish test report
        if: success() && hashFiles('reports/junit.xml') != ''
        uses: mikepenz/action-junit-report@v6
        continue-on-error: true
        with:
          report_paths: reports/junit.xml
          check_name: junit
          include_passed: true

      - name: Upload xcresult artifact
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: xcode-test-xcresult
          path: TestResults.xcresult
          if-no-files-found: warn

      - name: Test summary
        if: always()
        run: |
          {
            echo "## test"
            echo "- Status: ${{ job.status }}"
            echo "- Destination: iPhone 17"
            echo "- Result bundle: TestResults.xcresult"
            echo "- JUnit report: reports/junit.xml"
          } >> "$GITHUB_STEP_SUMMARY"
