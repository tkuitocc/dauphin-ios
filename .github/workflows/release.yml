name: Release iOS app

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Build and Release
    runs-on: macos-latest

    steps:
      - name: Check out code
        uses: actions/checkout@v7

      - name: Add plist file
        env:
          AES256KEY: ${{ secrets.DAUPHIN_IOS_AES256KEY }}
          AES256IV: ${{ secrets.DAUPHIN_IOS_AES256KIV }}
        run: |
          set -eu

          : "${AES256KEY:?Set DAUPHIN_IOS_AES256KEY secret}"
          : "${AES256IV:?Set DAUPHIN_IOS_AES256KIV secret}"

          script_directory="$GITHUB_WORKSPACE"
          template_path="${script_directory}/app/dauphin/api.example.plist"
          output_path="${script_directory}/app/dauphin/api.plist"
          temporary_path="$(mktemp "${output_path}.XXXXXX")"

          cleanup() {
              rm -f "$temporary_path"
          }

          trap cleanup EXIT HUP INT TERM

          cp "$template_path" "$temporary_path"

          /usr/bin/plutil \
            -replace AES.KEY \
            -string "$AES256KEY" \
            "$temporary_path"

          /usr/bin/plutil \
            -replace AES.IV \
            -string "$AES256IV" \
            "$temporary_path"

          /usr/bin/plutil -lint "$temporary_path"

          mv "$temporary_path" "$output_path"

          trap - EXIT HUP INT TERM

          echo "Generated dauphin/api.plist"

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: zulu
          java-version: "21"

      - name: Set Xcode version
        run: |
          sudo xcode-select -s /Applications/Xcode.app/Contents/Developer
          xcodebuild -version

      - name: Build iOS Release
        uses: nick-fields/retry@v4
        with:
          timeout_minutes: 15
          max_attempts: 5
          command: |
            cd app
            xcodebuild \
              -scheme dauphin \
              -configuration Release \
              -sdk iphoneos \
              -destination 'generic/platform=iOS' \
              CODE_SIGNING_ALLOWED=NO \
              CODE_SIGNING_REQUIRED=NO \
              ONLY_ACTIVE_ARCH=NO \
              SYMROOT="$(pwd)/build" \
              clean build

      - name: Generate IPA
        run: |
          set -eu

          rm -rf Payload
          mkdir -p Payload

          cp -r \
            "app/build/Release-iphoneos/dauphin.app" \
            Payload/

          zip -r "dauphin-${GITHUB_REF_NAME}.ipa" Payload

          rm -rf Payload

      - name: Upload IPA to workflow
        uses: actions/upload-artifact@v7
        with:
          name: dauphin-${{ github.ref_name }}.ipa
          path: ./dauphin-${{ github.ref_name }}.ipa
          if-no-files-found: error

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: ./dauphin-${{ github.ref_name }}.ipa
